# openAssassin 加固版 Docker Compose 部署
# 用法: cp .env.example .env && 填入强随机密钥 && docker compose -f deploy/docker-compose.hardened.yml up -d
#
# 与默认 docker-compose.yml 的关键区别:
# - backend 非 root 运行 (user: 10001)
# - 容器 read_only + tmpfs
# - cap_drop: ALL + no-new-privileges
# - docker-socket-proxy 白名单代理替代直挂 docker.sock
# - healthcheck 健康检查
# - ${VAR:?} 强制必填密钥
# - 日志轮转限制

services:
  backend:
    build: ../backend
    image: infra-ops-backend:latest
    container_name: ops-backend
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 512m
    cpus: "2.0"
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET 必须设置 (openssl rand -hex 32)}
      - MASTER_KEY=${MASTER_KEY:?MASTER_KEY 必须设置 (>=32字节)}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:?ADMIN_DEFAULT_PASSWORD 必须设置}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - DATABASE_URL=sqlite:///./data/ops.db
      - SANDBOX_IMAGE_SHELL=${SANDBOX_IMAGE_SHELL:-alpine:3.20}
      - SANDBOX_IMAGE_PYTHON=${SANDBOX_IMAGE_PYTHON:-python:3.12-alpine}
      - SANDBOX_MEMORY_LIMIT=${SANDBOX_MEMORY_LIMIT:-256m}
      - SANDBOX_CPU_LIMIT=${SANDBOX_CPU_LIMIT:-0.5}
      - SANDBOX_DEFAULT_TIMEOUT=${SANDBOX_DEFAULT_TIMEOUT:-300}
      - SANDBOX_MAX_TIMEOUT=${SANDBOX_MAX_TIMEOUT:-3600}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - ALERT_EMAIL=${ALERT_EMAIL:-}
      - ALERT_BEFORE_DAYS=${ALERT_BEFORE_DAYS:-7}
      - ALERT_CHECK_INTERVAL_MINUTES=${ALERT_CHECK_INTERVAL_MINUTES:-60}
      - SSH_CONNECT_TIMEOUT=${SSH_CONNECT_TIMEOUT:-10}
      - SSH_TERMINAL_IDLE_TIMEOUT=${SSH_TERMINAL_IDLE_TIMEOUT:-3600}
      - AUDIT_ENABLED=${AUDIT_ENABLED:-true}
      - AUDIT_IP_SOURCE=${AUDIT_IP_SOURCE:-forwarded}
      - AUDIT_LOG_RETENTION_DAYS=${AUDIT_LOG_RETENTION_DAYS:-180}
      - TOTP_ISSUER=${TOTP_ISSUER:-openAssassin}
      - LOG_DIR=/app/data/logs
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - DOCKER_TLS_VERIFY=0
    depends_on:
      docker-socket-proxy:
        condition: service_started
    volumes:
      - ../data:/app/data
      - ../backups:/backups
      - /tmp/openassassin-sandbox:/tmp/openassassin-sandbox
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - ops
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: ops-docker-socket-proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 64m
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - GET=1
      - POST=1
      - DELETE=1
      - PING=1
      - AUTH=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - EVENTS=0
      - EXEC=0
      - GRPC=0
      - INFO=0
      - NETWORKS=0
      - NODES=0
      - PLUGINS=0
      - SECRETS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
      - VOLUMES=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ops

  frontend:
    build: ../frontend
    image: infra-ops-frontend:latest
    container_name: ops-frontend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    mem_limit: 256m
    cpus: "0.5"
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ops
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ops:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
