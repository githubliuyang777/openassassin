# openAssassin 改进版 nginx 配置
# 关键改进:
# - 安全头 (X-Content-Type-Options, X-Frame-Options, Referrer-Policy)
# - X-Forwarded-For 用覆盖式防伪造
# - 仅 WebSocket 终端路径给长超时，其余 API 保持默认 60s
# - proxy_buffering off 仅对 WS 路径

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # SPA 路由: 非静态文件回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 普通 API: 默认超时, 60s 足够
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSH 终端 WebSocket: 长超时 + Upgrade
    location ~* ^/api/v1/hosts/[0-9]+/terminal {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
