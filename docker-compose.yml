version: "3.9"

services:
  backend:
    build: ./backend
    container_name: ops-backend
    restart: unless-stopped
    environment:
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - MASTER_KEY=${MASTER_KEY:-change-me-master-key-32-bytes!!}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - DATABASE_URL=sqlite:///./data/ops.db
      - SANDBOX_IMAGE_SHELL=${SANDBOX_IMAGE_SHELL:-alpine:3.20}
      - SANDBOX_IMAGE_PYTHON=${SANDBOX_IMAGE_PYTHON:-python:3.12-alpine}
      - SANDBOX_IMAGE_AWSCLI=${SANDBOX_IMAGE_AWSCLI:-amazon/aws-cli:2.x}
      - ALERT_EMAIL=${ALERT_EMAIL:-}
      - ALERT_BEFORE_DAYS=${ALERT_BEFORE_DAYS:-7}
      - ALERT_CHECK_INTERVAL_MINUTES=${ALERT_CHECK_INTERVAL_MINUTES:-60}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/openassassin-sandbox:/tmp/openassassin-sandbox
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: ops-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
