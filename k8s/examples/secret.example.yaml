# Secret 模板：仅作示例，不要把填写后的真实值提交到 Git。
# 该文件未加入 kustomization.yaml，kubectl apply -k 不会创建/覆盖它。
#
# 推荐直接使用命令创建（见 k8s/README.md）：
#   kubectl -n openassassin create secret generic openassassin-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=MASTER_KEY="$(openssl rand -hex 32)" \
#     --from-literal=ADMIN_DEFAULT_PASSWORD='<强密码>' \
#     --from-literal=SMTP_PASSWORD=''
#
# 注意：
# - MASTER_KEY 首次启用后必须永久保持不变，否则已加密的凭据将无法解密。
# - ADMIN_DEFAULT_PASSWORD 仅在首次建库（admin 不存在）时生效。
apiVersion: v1
kind: Secret
metadata:
  name: openassassin-secrets
  namespace: openassassin
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME_openssl_rand_hex_32"
  MASTER_KEY: "REPLACE_ME_AND_KEEP_FOREVER_openssl_rand_hex_32"
  ADMIN_DEFAULT_PASSWORD: "REPLACE_ME_STRONG_PASSWORD"
  SMTP_PASSWORD: ""
