name: CD

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: cd-master
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_REPO }}
  IMAGE_TAG: sha-${{ github.sha }}
  GITOPS_REPOSITORY: githubliuyang777/openassassin-gitops

jobs:
  build:
    name: Build ${{ matrix.component.name }}
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        component:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Hub repository
        run: |
          if [ -z "${DOCKERHUB_REPO}" ]; then
            echo "DOCKERHUB_REPO secret is not set"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.component.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.DOCKERHUB_REPO }}-${{ matrix.component.name }}:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_REPO }}-${{ matrix.component.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component.name }}

  update-staging:
    name: Update staging overlay
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPOSITORY }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          ref: ${{ vars.GITOPS_BRANCH || 'main' }}

      - name: Set up kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.6.0"

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin

      - name: Update staging image tag
        env:
          DOCKERHUB_REPO: ${{ env.DOCKERHUB_REPO }}
        run: |
          cd gitops
          ./scripts/set-image.sh staging "${IMAGE_TAG}"
          ./scripts/validate.sh

      - name: Commit and push staging overlay
        working-directory: gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add environments/staging
          if git diff --cached --quiet; then
            echo "No staging changes to commit"
            exit 0
          fi
          git commit -m "chore(staging): deploy ${IMAGE_TAG}" \
            -m "Source: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
          git push origin HEAD

      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

      - name: Sync staging
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          if [ -z "${ARGOCD_SERVER}" ] || [ -z "${ARGOCD_AUTH_TOKEN}" ]; then
            echo "ARGOCD_SERVER / ARGOCD_AUTH_TOKEN secrets are not set"
            exit 1
          fi
          argocd login "${ARGOCD_SERVER}" --auth-token "${ARGOCD_AUTH_TOKEN}" --grpc-web
          argocd app sync openassassin-staging --timeout 600
          argocd app wait openassassin-staging --sync --health --timeout 900

      - name: Verify staging health
        run: |
          if [ -z "${{ vars.STAGING_URL }}" ]; then
            echo "STAGING_URL repository variable is not set"
            exit 1
          fi
          curl -fsS "${{ vars.STAGING_URL }}/api/health"
