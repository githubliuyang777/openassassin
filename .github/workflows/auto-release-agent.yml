name: Auto Release Agent

on:
  push:
    branches: [master]
    paths:
      - 'host-agent/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest agent tag
        id: get-tag
        run: |
          LATEST_TAG=$(git tag -l 'agent-v*' --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="agent-v0.0.0"
          fi
          echo "latest=$LATEST_TAG" >> "$GITHUB_OUTPUT"

          VERSION=${LATEST_TAG#agent-v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          NEW_TAG="agent-v${NEW_VERSION}"

          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "New tag: $NEW_TAG"

      - name: Create and push tag
        run: |
          NEW_TAG="${{ steps.get-tag.outputs.new_tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Auto release $NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build (linux/amd64)
        working-directory: host-agent
        run: |
          NEW_TAG="${{ steps.get-tag.outputs.new_tag }}"
          VERSION="${NEW_TAG#agent-v}"
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -ldflags="-s -w -X main.Version=${VERSION}" \
            -o dist/host-agent-linux-amd64 .

      - name: Build (linux/arm64)
        working-directory: host-agent
        run: |
          NEW_TAG="${{ steps.get-tag.outputs.new_tag }}"
          VERSION="${NEW_TAG#agent-v}"
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 \
            go build -ldflags="-s -w -X main.Version=${VERSION}" \
            -o dist/host-agent-linux-arm64 .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get-tag.outputs.new_tag }}
          name: "Host Agent ${{ steps.get-tag.outputs.new_tag }}"
          body: |
            ### host-agent ${{ steps.get-tag.outputs.new_tag }}

            用于 openAssassin 平台的主机监控 Agent，采集 CPU/内存/磁盘/负载/网络指标并上报。

            #### 安装
            ```bash
            curl -fsSL https://github.com/githubliuyang777/openassassin/releases/latest/download/install.sh | sudo bash -s -- \
              --server https://your-platform.example.com \
              --token oa_YOUR_AGENT_TOKEN
            ```

            #### 手动下载
            - [host-agent-linux-amd64](https://github.com/githubliuyang777/openassassin/releases/download/${{ steps.get-tag.outputs.new_tag }}/host-agent-linux-amd64)
            - [host-agent-linux-arm64](https://github.com/githubliuyang777/openassassin/releases/download/${{ steps.get-tag.outputs.new_tag }}/host-agent-linux-arm64)
          files: |
            host-agent/dist/host-agent-linux-amd64
            host-agent/dist/host-agent-linux-arm64
            host-agent/install.sh
          generate_release_notes: true
